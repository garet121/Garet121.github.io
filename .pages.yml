content:
  - name: posts
    label: Blog Posts
    path: _posts
    type: collection
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: content
        label: Content
        type: rich-text

  - name: resume
    label: Resume
    path: resume.md
    type: file
    fields:
      - name: content
        label: Content
        type: rich-text
